url: https://ancestry.bartfeenstra.com
clean_urls: true
title: Lankester & Feenstra
author: Bart Feenstra
lifetime_threshold: 100
enrichers:
  ancestry: {}
  deriver: {}
  privatizer: {}
  wiki: {}
generate_entity_list_html:
  - person
  - event
  - place
  - source
extensions:
  raspberry-mint:
    data:
      regional_content:
        front-page-content:
          - plugin: raspberry-mint-columns
            data:
              content:
                - - plugin: raspberry-mint-entity-card
                    data:
                      type: person
                      id: I0004
                - - plugin: raspberry-mint-entity-card
                    data:
                      type: place
                      id: P0000
                - - plugin: raspberry-mint-entity-card
                    data:
                      type: person
                      id: I0025
              width:
                xs: [12, 12, 12]
                md: [6, 6, 6]
                lg: [4, 4, 4]
  maps: {}
  nginx:
    data:
      https: false
      legacy_entity_redirects: true
      www_directory: /var/www/betty/
  http-api-doc: {}
  trees: {}
loaders:
  gramps:
    data:
      family_trees:
        - file: ./input/ancestry.gramps
          event_types:
            Conference: conference
            Correspondence: correspondence
            Funeral: funeral
            Missing: missing
          place_types:
            Cemetery: cemetery
          roles:
            Attendee: attendee
            Beneficiary: beneficiary
            Organizer: organizer
            Speaker: speaker
locales:
  - locale: en-US
    alias: en
  - locale: nl-NL
    alias: nl
  - locale: uk
copyright_notices:
  friends-of-highgate-cemetery-trust:
    label: Friends of Highgate Cemetery Trust
    summary: Copyright Friends of Highgate Cemetery Trust
    text: Copyright Friends of Highgate Cemetery Trust
